services:
  shelly-toolbox:
    image: ghcr.io/hco/shelly-toolbox:latest
    container_name: shelly-toolbox
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - SHELLY_AUTO_PROVISION=true
      - NODE_ENV=production
    volumes:
      # D-Bus socket for NetworkManager access (WiFi provisioning)
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      # Persistent data storage
      - shelly-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:38731/shelly"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  shelly-data:
    driver: local
